<div>
    <h3>Importar archivo Excel</h3>
    <input type="file" (change)="onFileChange($event)" accept=".xlsx, .xls" />
  
    <div>
      <label for="column">Seleccionar columna (Índice):</label>
      <input
        id="column"
        type="number"
        [(ngModel)]="selectedColumnIndex"
        (input)="updateSortedData()"
        min="0"
        placeholder="Ejemplo: 0 para la primera columna"
      />
    </div>
  
    <div>
      <label for="decimals">Número de decimales:</label>
      <input id="decimals" type="number" [(ngModel)]="decimalPlaces" min="0" />
    </div>
  
    <div>
      <label for="confidence">Índice de confianza (0 - 1):</label>
      <input id="confidence" type="number" [(ngModel)]="confidenceIndex" min="0" max="1" step="0.1" />
    </div>
  
    <table *ngIf="data.length > 0">
      <thead>
        <tr>
          <th>Fila</th>
          <th>Valor</th>
          <th>Ordenado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of data.slice(1); let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ formatData(row[selectedColumnIndex]) }}</td>
          <td *ngIf="sortedData.length > i">{{ formatData(sortedData[i]) }}</td>
          <td *ngIf="sortedData.length <= i">-</td>
        </tr>
      </tbody>
    </table>
  </div>
