<h2>Prueba de Series</h2>
<input type="file" (change)="cargarExcel($event)" />
<br /><br />
<label for="columna">Selecciona la columna a trabajar:</label>
<input 
  id="columna" 
  type="number" 
  [(ngModel)]="columnaSeleccionada" 
  (change)="actualizarColumna()" 
/>
<br /><br />
<label for="decimales">Número de decimales:</label>
<input 
  id="decimales" 
  type="number" 
  [(ngModel)]="decimales" 
/>
<br /><br />
<label for="confianza">Índice de confianza (entre 0 y 1):</label>
<input 
  id="confianza" 
  type="number" 
  step="0.01" 
  [(ngModel)]="indiceConfianza" 
/>
<br /><br />

<button mat-raised-button color="primary" (click)="pruebaDeSeries()">Calcular Series</button>

<h3>Tabla de pares ordenados</h3>
<table border="1">
  <thead>
    <tr>
      <th>#</th>
      <th>x (Valor)</th>
      <th>y (Siguiente valor)</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let par of paresOrdenados; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ par[0].toFixed(decimales) }}</td>
      <td>{{ par[1].toFixed(decimales) }}</td>
    </tr>
  </tbody>
</table>
